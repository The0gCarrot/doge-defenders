# CoinGecko collection config — Doge Defenders

# Free-tier friendly: sleep between calls (seconds). Public tier is strict.
rate_limit_seconds: 15
# Optional: set COINGECKO_API_KEY in the environment for a demo/pro key.
base_url: "https://api.coingecko.com/api/v3"
# /market_chart/range and days=max are paid-only; public tier allows days<=365.
chart_days: 365

# 15 liquid non-stable tokens (CoinGecko ids). DOGE included for brand.
# Volume: 15 tokens × 34 entry dates = 510 snapshots (≥500 course bar).
tokens:
  - bitcoin
  - ethereum
  - solana
  - dogecoin
  - cardano
  - ripple
  - avalanche-2
  - chainlink
  - polkadot
  - litecoin
  - near
  - arbitrum
  - aave
  - uniswap
  - pepe

# Weekly entry dates inside the free-tier 365d chart window.
# Last entry 2026-06-08 + 90d labels through 2026-09-06 (before collection day).
entry_dates:
  - "2025-10-20"
  - "2025-10-27"
  - "2025-11-03"
  - "2025-11-10"
  - "2025-11-17"
