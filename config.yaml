# Doge Defenders — daily report + paper trading config

rate_limit_seconds: 15
base_url: "https://api.coingecko.com/api/v3"
chart_days: 365

# 15 tokens × 34 calendar days = 510 daily reports (≥500 course bar).
tokens:
  - bitcoin
  - ethereum
  - solana
  - dogecoin
  - cardano
  - ripple
  - avalanche-2
  - chainlink
  - polkadot
  - litecoin
  - near
  - arbitrum
  - aave
  - uniswap
  - pepe

# Display names for GDELT queries (reduce false positives).
token_display_names:
  bitcoin: Bitcoin
  ethereum: Ethereum
  solana: Solana
  dogecoin: Dogecoin
  cardano: Cardano
  ripple: XRP
  avalanche-2: Avalanche
  chainlink: Chainlink
  polkadot: Polkadot
  litecoin: Litecoin
  near: NEAR Protocol
  arbitrum: Arbitrum
  aave: Aave
  uniswap: Uniswap
  pepe: Pepe

# Yahoo Finance RSS symbols (USD pairs).
yahoo_symbols:
  bitcoin: BTC-USD
  ethereum: ETH-USD
  solana: SOL-USD
  dogecoin: DOGE-USD
  cardano: ADA-USD
  ripple: XRP-USD
  avalanche-2: AVAX-USD
  chainlink: LINK-USD
  polkadot: DOT-USD
  litecoin: LTC-USD
  near: NEAR-USD
  arbitrum: ARB-USD
  aave: AAVE-USD
  uniswap: UNI-USD
  pepe: PEPE-USD

# Consecutive daily report dates. End date is far enough back that
# price at T+90 exists in the free-tier 365d chart (collection ~Sep 2026).
daily_report_days: 34
daily_end_date: "2026-06-26"
# Also write today's 15 token rows (paper portfolio starts here; 90d label may be missing).
include_today: true

label_horizon_days: 90
hist_lookback_days: 30
news_lookback_days: 10

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  # Canonical daily table (also aliased as snapshots_csv for older scripts).
  daily_reports_csv: "data/processed/daily_reports.csv"
  snapshots_csv: "data/processed/daily_reports.csv"
  research_notes_csv: "data/manual/research_notes.csv"
  adequacy_report: "data/processed/adequacy_report.json"
  model_path: "data/processed/invest_model.joblib"
  model_metrics: "data/processed/model_metrics.json"
  decisions_csv: "data/processed/decisions.csv"
  latest_decisions_csv: "data/processed/latest_decisions.csv"
  last_query_json: "data/processed/last_query.json"
  paper_ledger_csv: "data/processed/paper_ledger.csv"
  paper_bankroll_json: "data/processed/paper_bankroll.json"

# Model: Invest if P(up in 90d)*100 >= threshold.
invest_threshold: 50
# Paper trading starts on the first live day and keeps going.
# "today" would wipe yesterday's positions every morning.
# Rows before this date stay N/A and never enter the ledger.
paper_start_date: "2026-09-26"
paper_starting_balance: 1000
paper_stop_loss_pct: -15
paper_take_profit_pct: 25
paper_max_hold_days: 90
# Invest score 94 → allocate 9.4% of remaining cash (allocation_pct = score / 10).
