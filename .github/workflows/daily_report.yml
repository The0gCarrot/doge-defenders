name: Daily coin report

on:
  schedule:
    # 00:20 UTC, just after the calendar day changes, so the file gets that day's prices.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the experiment branch
        uses: actions/checkout@v4
        with:
          ref: m3-exploratory
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write today's 15 reports and update the paper book
        run: python -m src.daily_update

      - name: Save the new rows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/daily_reports.csv data/processed/decisions.csv data/processed/latest_decisions.csv data/processed/model_metrics.json data/processed/paper_ledger.csv data/processed/paper_bankroll.json data/processed/invest_model.joblib
          if git diff --staged --quiet; then
            echo "No change to commit."
          else
            git commit -m "Add the UTC daily report for $(date -u +%Y-%m-%d)."
            git push
          fi
